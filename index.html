<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef0ee">
<title>원만하다 — 골라서 만드는 건물·공간 리모델링 설계</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232453c4' stroke-width='3'/%3E%3Crect x='10' y='10' width='12' height='12' fill='%232453c4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#eef0ee;--panel:#fbfcfb;--panel2:#f3f5f3;--ink:#1d2124;--sub:#5d6762;--line:#d5d9d6;--line2:#e4e7e5;
 --accent:#2453c4;--accent-ink:#fff;--accent-soft:rgba(36,83,196,.1);--dimc:#2f7d4f;--warn:#9a5200;--danger:#b3261e;
 --wall:#25292c;--canvas:#ffffff;--furn:#7c8580;--glaz:#2453c4;--grid:#eef1ef;
 --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
 --r1:6px;--r2:10px;color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#131618;--panel:#1a1e21;--panel2:#212629;--ink:#e4e8e5;--sub:#99a39e;--line:#2d3337;--line2:#262b2f;
 --accent:#87a6ff;--accent-ink:#0c1430;--accent-soft:rgba(135,166,255,.14);--dimc:#79c99c;--warn:#f0b25a;--danger:#ff8a80;
 --wall:#dfe4e1;--canvas:#0f1214;--furn:#7f8a85;--glaz:#87a6ff;--grid:#171b1d;color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#131618;--panel:#1a1e21;--panel2:#212629;--ink:#e4e8e5;--sub:#99a39e;--line:#2d3337;--line2:#262b2f;
 --accent:#87a6ff;--accent-ink:#0c1430;--accent-soft:rgba(135,166,255,.14);--dimc:#79c99c;--warn:#f0b25a;--danger:#ff8a80;
 --wall:#dfe4e1;--canvas:#0f1214;--furn:#7f8a85;--glaz:#87a6ff;--grid:#171b1d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r1);padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--canvas);border:1px solid var(--line);border-radius:var(--r1);padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
label.chk input{accent-color:var(--accent);width:16px;height:16px}
.muted{color:var(--sub)}
.num{font-variant-numeric:tabular-nums}

/* ---------- 로그인 ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);padding:24px;z-index:50}
.login-card{width:min(380px,100%)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.login-card .brand b{font-size:30px}
.login-card .brand svg{width:40px;height:40px}
.login-card p.lead{margin:14px 0 26px;color:var(--sub);font-size:14.5px;max-width:34ch}
.field{display:grid;gap:5px;margin-bottom:12px}
.field span{font-size:12.5px;color:var(--sub);font-weight:500}
.login-card .btn.pri{width:100%;padding:11px;font-size:15px;margin-top:6px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:6px 0 0}

/* ---------- 앱 레이아웃 (컴퓨터·노트북·패드) ---------- */
#app{display:grid;height:100%;grid-template-columns:340px minmax(0,1fr) 248px;grid-template-rows:50px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .proj{font-size:13px;color:var(--sub);border-left:1px solid var(--line);padding-left:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28vw}
.top .sp{flex:1}
.top .acts{display:flex;gap:6px}
.left{border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.right{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
.sec{padding:16px 16px 18px;border-bottom:1px solid var(--line2)}
.sec h2{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h2 .cnt{font-weight:400;color:var(--sub);font-size:12px}
.mhead{display:none}

/* 입력: 명령줄 */
.cmd{position:relative;border:1.5px solid var(--ink);border-radius:var(--r2);background:var(--canvas);overflow:hidden}
.cmd:focus-within{border-color:var(--accent)}
.cmd textarea{border:0;border-radius:0;min-height:128px;resize:vertical;padding:12px 13px 8px;font-size:15px;line-height:1.65;background:transparent}
.cmd .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--line2);background:var(--panel2)}
.cmd .bar small{color:var(--sub);font-size:12px}
.hl{margin:10px 0 0;font-size:14px;line-height:1.95;color:var(--sub);word-break:keep-all}
.hl:empty{display:none}
mark.tk{background:none;color:var(--ink);border-bottom:2px solid;padding:0 1px;cursor:help}
.tk-size{border-color:#2453c4}.tk-roof{border-color:#7a4cc2}.tk-room{border-color:#2f7d4f}.tk-furn{border-color:#c07a00}.tk-mat{border-color:#0d8a8a}.tk-height{border-color:#0b74b8}.tk-type{border-color:#6b7280}.tk-opt{border-color:#2f7d4f}.tk-warn{border-color:var(--danger)}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ex button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--sub)}
.ex button:hover{color:var(--ink);border-color:var(--sub)}
.go{width:100%;margin-top:12px;padding:10px;font-size:14.5px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--panel2)}
.chip i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.warns{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.warns li{font-size:12.5px;color:var(--warn);padding-left:14px;position:relative}
.warns li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border:1.5px solid currentColor;transform:rotate(45deg)}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.form .full{grid-column:1/-1}
.form label.f{display:grid;gap:4px;font-size:12px;color:var(--sub);font-weight:500}
.form .toggles{display:flex;flex-wrap:wrap;gap:8px 14px;grid-column:1/-1;padding-top:2px}
.rooms{display:grid;gap:10px}
.roomc{border:1px solid var(--line);border-radius:var(--r1);padding:10px;display:grid;grid-template-columns:1fr;gap:8px;align-items:center}
.roomc b{grid-column:1/-1;font-size:13px}
.roomc .row{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
table.area{width:100%;border-collapse:collapse;font-size:13px}
table.area th,table.area td{padding:6px 4px;border-bottom:1px solid var(--line2);text-align:right}
table.area th:first-child,table.area td:first-child{text-align:left}
table.area thead th{font-size:12px;color:var(--sub);font-weight:500}
table.area tfoot td{font-weight:600;border-bottom:0;border-top:1.5px solid var(--ink)}

.seg.modes{display:flex;margin-bottom:12px}.modes button{flex:1;padding:8px 0}
.aib{margin-left:8px;color:var(--accent);font-weight:600}
.pg{margin-bottom:14px}.pg h3{font-size:12.5px;font-weight:600;margin:0 0 7px;display:flex;gap:8px;align-items:baseline}
.pbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pb{border:1px solid var(--line);background:var(--panel);border-radius:var(--r1);padding:8px 12px;font-size:13px;min-height:38px}
.pb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.pb.add{border-style:dashed}
.pg input[type=range]{width:100%;accent-color:var(--accent)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 4px 4px 11px;font-size:12.5px;border:1px solid var(--line);background:var(--panel2)}
.rchip.k-master{border-color:#2453c4}.rchip.k-bed{border-color:#2f7d4f}.rchip.k-other{border-color:#c07a00}
.rchip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;color:var(--sub)}
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.addrow .sp{flex:1}
.roomc .rh{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.roomc .rh input{flex:1;min-width:0}.roomc .rh select{width:auto}
.fchips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:2px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 2px 2px 8px;background:var(--panel2)}
.fchip button{border:0;background:transparent;width:22px;height:22px;color:var(--sub);font-size:14px;line-height:1}
.fchip button:hover{color:var(--ink)}
.roomc select[data-addf]{grid-column:1/-1}
.fit{grid-column:1/-1;font-size:12.5px}.fit p{margin:2px 0}.fit .ok{color:var(--dimc)}.fit .bad,p.fit.bad{color:var(--danger)}
.chk-list{display:grid;gap:10px}.ci{border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px}
.ci .cm{font-size:13.5px;margin-bottom:8px}.ci .tag{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:6px}
.ci .cf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.din{display:inline-flex;gap:4px;align-items:center;font-size:12px}.din input{width:70px;padding:4px 6px}
.row.sz{align-items:center;gap:5px}.row.sz input{width:78px;padding:5px 6px}.fpy{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.blrow{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--line2)}.blrow .no{width:18px;height:18px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:11px}.blrow .sp{flex:1}.blrow.bad b{color:var(--danger)}.blrow .btn.sm{padding:2px 6px}
#bEdit[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table.area tr.fl td{font-weight:600;padding-top:12px;color:var(--accent)}
/* ---------- 작업 화면 ---------- */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr) 28px;min-width:0;background:var(--canvas);position:relative}
.stagebar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:13px;font-weight:500;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.stagebar .sp{flex:1}
.stagebar select{width:auto;padding:5px 8px;font-size:13px}
.view{position:relative;overflow:hidden;touch-action:none}
#v2d{background:var(--canvas);cursor:crosshair}
#v2d.pan{cursor:grabbing}
#svg{width:100%;height:100%;display:block;user-select:none}
#v3d canvas{display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);padding:30px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);background:var(--canvas)}
.status{display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden}
.status .xy{font-family:var(--mono);min-width:190px}
.status .wn{color:var(--warn)}
.mtip{position:absolute;pointer-events:none;background:var(--ink);color:var(--canvas);font:500 12px var(--mono);padding:3px 7px;border-radius:4px;transform:translate(10px,-28px);white-space:nowrap}

/* SVG 도면 스타일 */
#svg text{font-family:var(--font);fill:var(--ink)}
#svg .L line,#svg .L polyline,#svg .L polygon,#svg .L rect,#svg .L circle{vector-effect:non-scaling-stroke;stroke-width:1px;fill:none}
#svg .L-wall polygon{fill:var(--wall);stroke:var(--wall)}#svg .L-wall line{stroke:var(--wall)}
#svg .L-room polygon{stroke:none}
#svg .f-rf-bed,#svg .f-rf-dress{fill:rgba(36,83,196,.045)}#svg .f-rf-bath,#svg .f-rf-util,#svg .f-rf-wet{fill:rgba(13,138,138,.07)}
#svg .f-rf-living,#svg .f-rf-studio{fill:rgba(192,122,0,.045)}#svg .f-rf-kitchen{fill:rgba(192,122,0,.07)}#svg .f-rf-entry,#svg .f-rf-pantry,#svg .f-rf-storage{fill:rgba(100,110,105,.08)}
#svg .f-rf-deck{fill:rgba(140,100,70,.12)}
#svg .L-furn *{stroke:var(--furn)}#svg .L-furn text{fill:var(--furn);stroke:none}
#svg .f-ff{fill:var(--canvas)!important}#svg .f-ink{fill:var(--ink)!important;stroke:var(--ink)}
#svg .L-win *{stroke:var(--glaz)}#svg .L-win rect,#svg .L-win polygon{fill:var(--canvas)}
#svg .L-door *{stroke:var(--ink)}#svg .f-gap{stroke:none!important}
#svg .L-aux *{stroke:var(--sub)}
#svg .L-stair *{stroke:var(--ink)}#svg .L-stair text{fill:var(--ink);stroke:none}
#svg .L-flow polyline{stroke:#d9480f;stroke-width:1.6px}
#svg .L-fail text{fill:var(--danger)}#svg .L-fail text.halo{paint-order:stroke;stroke:var(--canvas);stroke-width:50px;stroke-linejoin:round}
#svg .L-furn text{font-size:inherit}
#svg .dash{stroke-dasharray:6 4}
#svg .heavy{stroke-width:2.2px!important}
#svg .L-dim *{stroke:var(--dimc)}#svg .L-dim text{fill:var(--dimc);stroke:none}#svg .L-dim polygon.f-ink{fill:var(--dimc)!important;stroke:var(--dimc)}
#svg .L-label text.halo{paint-order:stroke;stroke:var(--canvas);stroke-width:60px;stroke-linejoin:round}
#svg .L-label polygon.f-ink{fill:var(--ink)}#svg .L-label circle{stroke:var(--sub)}
#svg .L-elev polygon{stroke:var(--ink);stroke-width:.8px}
#svg .L-ground polygon.f-paper{fill:var(--canvas);stroke:none}#svg .L-ground line{stroke:var(--ink)}
#svg .meas line{stroke:var(--danger);stroke-width:1.5px;vector-effect:non-scaling-stroke}#svg .meas circle{fill:var(--danger)}
#svg .snap{fill:none;stroke:var(--danger);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#svg .L-elev .f-m-wallExt{fill:#ece8df}#svg .L-elev .f-m-glass,#svg .L-elev .f-m-glassFrost{fill:#a9c3d2}#svg .L-elev .f-m-frame,#svg .L-elev .f-m-vent{fill:#33383c}#svg .L-elev .f-m-roof{fill:#5b636a}#svg .L-elev .f-m-roofFlat{fill:#9a9da0}#svg .L-elev .f-m-found{fill:#a7a6a2}#svg .L-elev .f-m-deck{fill:#9b7253}#svg .L-elev .f-m-doorExt{fill:#6b4630}
#svg[data-r="brick"] .L-elev .f-m-wallExt{fill:#b5654a}#svg[data-r="wood"] .L-elev .f-m-wallExt{fill:#b88a5c}#svg[data-r="metal"] .L-elev .f-m-wallExt{fill:#80878d}#svg[data-r="concrete"] .L-elev .f-m-wallExt{fill:#b4b3ae}
#svg[data-rf="zinc"] .L-elev .f-m-roof{fill:#7d8489}#svg[data-rf="tile"] .L-elev .f-m-roof{fill:#41454a}#svg[data-rf="shingle"] .L-elev .f-m-roof{fill:#5a524c}
#svg .L-elev polygon.ws{stroke:none}#svg .L-elev line{stroke:var(--ink);stroke-width:1.2px}

/* 옵션 패널 */
.opt h3{font-size:12.5px;font-weight:600;margin:0 0 8px;color:var(--ink)}
.opt + .opt{margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.opt .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt .stack{display:grid;gap:7px}
.opt .btn{width:100%}
.opt button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.opt input[type=range]{width:100%;accent-color:var(--accent)}
.opt .hint{font-size:12px;color:var(--sub);margin:8px 0 0}
.sheetlist{display:grid;gap:4px}
.sheetlist button{text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r1);padding:6px 9px;font-size:13px;display:flex;justify-content:space-between}
.sheetlist button span{color:var(--sub);font-size:12px}
.sheetlist button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* 더보기·설정 */
dialog#more,dialog#check{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);color:var(--ink);padding:0;width:min(560px,94vw);max-height:86vh}
dialog#check{width:min(640px,94vw)}dialog#check::backdrop,dialog#more::backdrop{background:rgba(10,14,16,.35)}
.more-in{padding:20px 22px;overflow:auto;max-height:86vh}
.more-in h2{font-size:16px;margin:0 0 14px}
.more-in h3{font-size:13px;margin:20px 0 8px}
.plist{display:grid;gap:6px;margin-bottom:8px}
.pitem{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:var(--r1);padding:7px 8px 7px 11px}
.pitem small{display:block;color:var(--sub);font-size:11.5px}
.row-acts{display:flex;gap:6px;flex-wrap:wrap}
pre.code{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r1);padding:10px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:9px 16px;border-radius:999px;font-size:13px;z-index:80}
.mnav,.mfloat,#info-menu,.optclose{display:none}
.optbtn{display:none}

/* 패드 세로·작은 노트북: 옵션 패널은 서랍으로 */
@media (max-width:1100px) and (min-width:641px){
 #app{grid-template-columns:300px minmax(0,1fr)}
 .right{position:fixed;right:0;top:50px;bottom:0;width:280px;z-index:20;transform:translateX(100%);transition:transform .2s;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
 body.optopen .right{transform:none}
 .optbtn{display:inline-flex}
 .top .proj{display:none}
}

/* ---------- 휴대폰: 한 화면에 한 가지 ---------- */
@media (max-width:640px){
 body{font-size:15px}
 #app{display:block;height:100%;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
 .top{height:52px;padding:0 14px}
 .top .proj,.top .acts{display:none}
 .left,.stage,.right{display:none;border:0}
 body[data-screen="input"] .left,body[data-screen="sec"] .left{display:block;height:calc(100% - 52px);overflow:auto}
 body[data-screen="input"] .sec:not(#sec-input),body[data-screen="sec"] .sec{display:none}

/** 방 둘레 벽에서 문·창 정보를 모은다 */
function roomOpenings(fm, r, I) {

const CRED = /*CRED*/{ id: 'wonman', salt: 'c794670e62cb1607e4db0f6799300240', iter: 120000, hash: '57f1dce519a12d44a41b0d459fe9ade8ea8a5265f60cf86f4c82f047166e05cc' }/*CRED*/;

  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(id + ':' + pw), 'PBKDF2', false, ['deriveBits']);

}
const AUTH_KEY = 'wonman.auth';
function authed() { return (localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY)) === CRED.hash; }

    if (ST.zoneTool && ST.zstart) { const p = snapPt(mx, my), a = ST.zstart; $('#meas').innerHTML = `<rect x="${Math.min(a[0], p[0])}" y="${-Math.max(a[1], p[1])}" width="${Math.abs(p[0] - a[0])}" height="${Math.abs(p[1] - a[1])}" style="fill:rgba(36,83,196,.12);stroke:var(--accent);stroke-width:1.5px;vector-effect:non-scaling-stroke"/>`; }
  });
  const end = e => { if (ST.drag) { ptrs.delete(e.pointerId); dropBlock(); return; }
    if (ST.zoneTool && ST.zstart && e.type === 'pointerup') { const [mx, my] = toModel(e.clientX, e.clientY); const a = ST.zstart; ST.zstart = null; $('#meas').innerHTML = ''; addZone(a, snapPt(mx, my)); ptrs.delete(e.pointerId); return; }
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (drag && !drag.moved && ST.measure && e.type === 'pointerup') { const [mx, my] = toModel(e.clientX, e.clientY); measureClick(e, mx, my); } drag = null; host.classList.remove('pan'); };
  host.addEventListener('pointerup', end); host.addEventListener('pointercancel', end); host.addEventListener('dblclick', fit2D);

}
function applyVB() { const v = ST.vb; $('#svg').setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`); if (ST.edit) drawBlocks(); }
function sheetPrims() { return ST.sheet.startsWith('plan') ? planPrims(ST.M, +ST.sheet.slice(4) || 0) : elevPrims(ST.M, ST.solids, ST.sheet); }
function draw2D(refit) { if (!ST.M) return; const { prims, snaps } = sheetPrims(); ST.prims = prims; ST.snaps = ST.M.imported ? ST.M.floors[0].segs.slice(0, 30000).flatMap(s => [[s.x1, s.y1], [s.x2, s.y2]]) : snaps; $('#svg').innerHTML = primsSVG(prims, ST.hidden) + '<g id="blk"></g><g class="meas" id="meas"></g>'; if (refit || !ST.vb) fit2D(); else applyVB(); drawMeasure(); drawBlocks(); $('#bEdit').hidden = !ST.P || (ST.P.mode === 'remodel' && ST.P.r.src === 'file') || !ST.sheet.startsWith('plan'); }
function fit2D() { if (!ST.prims) return; const b = primsBounds(ST.prims), m = 900; const bs = ST.edit && blocksOfSheet(); if (bs) { const ox = editOffset(); for (const k of bs.f.blocks) { b.x0 = Math.min(b.x0, k.x + ox); b.x1 = Math.max(b.x1, k.x + ox + k.w); b.y0 = Math.min(b.y0, k.y); b.y1 = Math.max(b.y1, k.y + k.d); } } ST.vb = { x: b.x0 - m, y: -b.y1 - m, w: b.x1 - b.x0 + 2 * m, h: b.y1 - b.y0 + 2 * m }; applyVB(); }
function setMeasure(on) { ST.measure = on; ST.mpts = []; $('#bMeasure').setAttribute('aria-pressed', on); drawMeasure(); $('#mtip').hidden = true; if (ST.view === '2d' && $('#oMeasure')) $('#oMeasure').setAttribute('aria-pressed', on); if (on) toast('두 점을 차례로 누르세요. Esc로 끝냅니다.'); }
function snapPt(mx, my) { const tol = 14 * ST._pxScale(); let best = null, bd = tol; for (const p of ST.snaps) { const d = Math.hypot(p[0] - mx, p[1] - my); if (d < bd) { bd = d; best = p; } } return best ? [...best, true] : [mx, my, false]; }
function measureHover(e, mx, my) { const p = snapPt(mx, my); ST.hover = p; drawMeasure(); if (ST.mpts.length === 1) { const a = ST.mpts[0], d = Math.hypot(p[0] - a[0], p[1] - a[1]); const t = $('#mtip'); t.hidden = false; const r = $('#v2d').getBoundingClientRect(); t.style.left = (e.clientX - r.left) + 'px'; t.style.top = (e.clientY - r.top) + 'px'; t.textContent = `${fmt(Math.round(d))} mm   ΔX ${fmt(Math.round(Math.abs(p[0] - a[0])))}  ΔY ${fmt(Math.round(Math.abs(p[1] - a[1])))}`; } }
function measureClick(e, mx, my) { const p = snapPt(mx, my); if (ST.mpts.length >= 2) ST.mpts = []; ST.mpts.push(p); drawMeasure(); if (ST.mpts.length === 2) { const [a, b] = ST.mpts; toast(`거리 ${fmt(Math.round(Math.hypot(b[0] - a[0], b[1] - a[1])))} mm`); $('#mtip').hidden = true; } }
function drawMeasure() {
  const g = $('#meas'); if (!g) return; const s = ST._pxScale ? ST._pxScale() : 10; let h = '';
  const pts = [...ST.mpts]; if (ST.measure && ST.mpts.length === 1 && ST.hover) pts.push(ST.hover);
  if (pts.length === 2) { const [a, b] = pts; h += `<line x1="${a[0]}" y1="${-a[1]}" x2="${b[0]}" y2="${-b[1]}"/>`; const d = Math.hypot(b[0] - a[0], b[1] - a[1]); if (ST.mpts.length === 2) h += `<text x="${(a[0] + b[0]) / 2}" y="${-(a[1] + b[1]) / 2 - 8 * s}" font-size="${13 * s}" text-anchor="middle" style="fill:var(--danger);paint-order:stroke;stroke:var(--canvas);stroke-width:${4 * s}px">${fmt(Math.round(d))}</text>`; }

  if (ST.measure && ST.hover && ST.hover[2]) h += `<rect class="snap" x="${ST.hover[0] - 6 * s}" y="${-ST.hover[1] - 6 * s}" width="${12 * s}" height="${12 * s}"/>`;

/* ---------- 내보내기 ---------- */
function svgStandalone() {
  const svg = $('#svg').cloneNode(true), b = primsBounds(ST.prims), m = 900;
  svg.setAttribute('viewBox', `${b.x0 - m} ${-b.y1 - m} ${b.x1 - b.x0 + 2 * m} ${b.y1 - b.y0 + 2 * m}`);
  svg.setAttribute('width', Math.round((b.x1 - b.x0 + 2 * m) / 10)); svg.setAttribute('height', Math.round((b.y1 - b.y0 + 2 * m) / 10));
  svg.querySelector('#meas')?.remove();
  const VARS = { '--canvas': '#ffffff', '--ink': '#1d2124', '--wall': '#25292c', '--glaz': '#2453c4', '--dimc': '#2f7d4f', '--furn': '#7c8580', '--sub': '#5d6762', '--danger': '#b3261e', '--font': '"IBM Plex Sans KR","Malgun Gothic",sans-serif' };

  css = css.replace(/var\((--[\w-]+)\)/g, (_, k) => VARS[k] || getComputedStyle(document.documentElement).getPropertyValue(k).trim());
  const st = document.createElementNS('http://www.w3.org/2000/svg', 'style'); st.textContent = css; svg.insertBefore(st, svg.firstChild);
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); bg.setAttribute('x', b.x0 - m); bg.setAttribute('y', -b.y1 - m); bg.setAttribute('width', b.x1 - b.x0 + 2 * m); bg.setAttribute('height', b.y1 - b.y0 + 2 * m); bg.setAttribute('fill', '#ffffff'); svg.insertBefore(bg, st.nextSibling);
  return new XMLSerializer().serializeToString(svg);
}
function export2D(kind) {
  const nm = `${fileBase()}_${sheets().find(s => s[0] === ST.sheet)[1]}`;
  if (kind === 'dxf') { download(nm + '.dxf', primsDXF(ST.prims, ST.hidden), 'application/dxf'); toast('DXF를 저장했습니다. CAD에서 DWG로 다시 저장할 수 있습니다.', 3500); }
  else if (kind === 'dxfall') { const all = []; let ox = 0; sheets().forEach(([k]) => { const pr = k.startsWith('plan') ? planPrims(ST.M, +k.slice(4)).prims : elevPrims(ST.M, ST.solids, k).prims; const b = primsBounds(pr), dx = ox - b.x0; pr.forEach(p => all.push(shiftPrim(p, dx))); ox += b.x1 - b.x0 + 6000; }); download(`${fileBase()}_전체도면.dxf`, primsDXF(all, ST.hidden), 'application/dxf'); toast('전체 도면을 한 파일로 저장했습니다.'); }
  else if (kind === 'svg') { download(nm + '.svg', svgStandalone(), 'image/svg+xml'); toast('SVG 파일을 저장했습니다.'); }
  else if (kind === 'png') { const s = svgStandalone(), img = new Image(); img.onload = () => { const W = 3000, H = Math.round(W * img.height / img.width); const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H); c.toBlob(b => { download(nm + '.png', b); toast('PNG 이미지를 저장했습니다.'); }); }; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
  else if (kind === 'print') { fit2D(); setTimeout(() => print(), 100); }
}
function export3D(kind) {
  const nm = fileBase();
  if (kind === 'rb') { download(nm + '_SketchUp.rb', exportRB(ST.solids, ST.name), 'text/plain'); toast('스케치업에서 load 하면 모델이 만들어집니다. 그다음 .skp로 저장하세요.', 4000); return; }
  if (kind === 'glb') { toast('GLB 파일을 만들고 있습니다…'); GL3.exportGLB(b => { if (!b) return toast('GLB를 만들지 못했습니다.'); download(nm + '_Unreal.glb', b); toast('GLB를 저장했습니다. 언리얼 엔진에서 Import 하세요.', 3500); }); return; }
  if (kind === 'dae') { download(nm + '.dae', exportDAE(ST.solids, ST.name), 'model/vnd.collada+xml'); toast('DAE 파일을 저장했습니다.'); }
  else if (kind === 'obj') { const { obj, mtl } = exportOBJ(ST.solids); download(nm + '.obj', obj); setTimeout(() => download('model.mtl', mtl), 400); toast('OBJ와 MTL 파일을 저장했습니다.'); }
  else { const url = GL3.snapshot(kind === 'render' ? 2 : 1); fetch(url).then(r => r.blob()).then(b => { download(`${nm}_${kind === 'render' ? '렌더링' : '3D'}.png`, b); toast('이미지를 저장했습니다.'); }); }
}

function shiftPrim(p, dx) { const q = { ...p }; if (q.t === 'l') { q.x1 += dx; q.x2 += dx; } else if (q.t === 'p') q.pts = q.pts.map(a => [a[0] + dx, a[1]]); else if (q.t === 'c' || q.t === 'a') q.cx += dx; else if (q.t === 't') q.x += dx; return q; }
/* ---------- 프로젝트·설정 ---------- */
const PKEY = 'wonman4.projects';
const projects = () => JSON.parse(localStorage.getItem(PKEY) || '[]');
function saveProject(asNew) {
  if (!ST.P) return toast('먼저 설계를 시작해 주세요.');
  let list = projects();

function openMore() {

    <label class="f">가로 (mm)<input type="number" id="cW" value="800"></label><label class="f">세로 (mm)<input type="number" id="cD" value="600"></label><label class="f">높이 (mm)<input type="number" id="cH" value="800"></label></div>

    <label class="f">모델<select id="aiModel"><option value="claude-sonnet-5-5"${ai.model !== 'claude-haiku-5-5' ? ' selected' : ''}>정확하게 (Sonnet)</option><option value="claude-haiku-5-5"${ai.model === 'claude-haiku-5-5' ? ' selected' : ''}>빠르게 (Haiku)</option></select></label></div>
   <div class="row-acts" style="margin-top:8px"><button class="btn" data-a="aisave">AI 설정 저장</button></div>
   <h3>화면 색</h3><div class="row-acts">${[['auto', '기기 설정 따르기'], ['light', '밝게'], ['dark', '어둡게']].map(([k, n]) => `<button class="btn sm" data-theme="${k}"${t === k ? ' style="border-color:var(--accent);color:var(--accent)"' : ''}>${n}</button>`).join('')}</div>
   <h3>계정 바꾸기</h3>
   <p class="muted" style="margin:0 0 8px;font-size:13px">새 아이디·비밀번호로 코드를 만든 뒤 index.html의 <b>const CRED</b> 줄을 통째로 바꿔 넣고 커밋하세요.</p>
   <div class="form"><label class="f">새 아이디<input type="text" id="nid" autocomplete="off"></label><label class="f">새 비밀번호<input type="password" id="npw" autocomplete="new-password"></label></div>

    const op = e.target.closest('[data-open]'); if (op) { const p = projects().find(x => x.id === op.dataset.open); if (p) { ST.P = p.P; ST.name = p.name; ST.pid = p.id; $('#projName').textContent = p.name; ST.ftab = 0; d.close(); $('#start').hidden = true; renderWizard(); rebuild(true); } }
    const de = e.target.closest('[data-del]'); if (de && confirm('이 프로젝트를 삭제할까요? 되돌릴 수 없습니다.')) { localStorage.setItem(PKEY, JSON.stringify(projects().filter(x => x.id !== de.dataset.del))); openMore(); }

}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(localStorage.getItem('wonman.theme') || 'auto'));
addEventListener('resize', () => { if (ST.view === '2d' && ST.vb) applyVB(); });
initLogin(startApp);
